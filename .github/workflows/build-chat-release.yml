name: Build Chat Completions Release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chat-completions-wire-api

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: codex
          - runner: macos-13
            target: x86_64-apple-darwin
            binary: codex
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: codex
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: codex.exe
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build codex-cli release
        run: cargo build --release --target ${{ matrix.target }} -p codex-cli
      - name: Build app-server release
        run: cargo build --release --target ${{ matrix.target }} -p codex-app-server
      - name: Upload codex-cli
        uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Upload app-server
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-${{ matrix.target }}
          path: codex-rs/target/${{ matrix.target }}/release/codex-app-server${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
